<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table and Form</title>
    <link rel="stylesheet" href="task4.css">
</head>

<body>

    <div class="header">
        <h1 id="page-title">Student Grades & Feedback</h1>
        <p>WEB Technologies 1 (Front End)</p>
    </div>

    <div class="navbar">
        <a href="index.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="exercise1/index.html">Task 3</a>
        <a href="task4.html">Task 4</a>
        <a href="task5.html">Task 5</a>
    </div>

    <div class="container">

        <div class="table-box">
            <h2>Student Grades</h2>
            <table>
                <tr>
                    <th rowspan="2">Student</th>
                    <th colspan="2">Results</th>
                    <th rowspan="2">Final Grade</th>
                </tr>
                <tr>
                    <th>HTML</th>
                    <th>CSS</th>
                </tr>
                <tr>
                    <td>Aruzhan</td>
                    <td>85</td>
                    <td>88</td>
                    <td>B+</td>
                </tr>
                <tr class="highlight-row">
                    <td>Kuralay</td>
                    <td>92</td>
                    <td>90</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Dias</td>
                    <td>78</td>
                    <td>82</td>
                    <td>B</td>
                </tr>
                <tr>
                    <td>Alina</td>
                    <td>89</td>
                    <td>86</td>
                    <td>B+</td>
                </tr>

            </table>

        </div>

        <div class="form-box">

            <h2>Feedback Form</h2>
            <form>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <label for="role">Your Role:</label>
                <select id="role" name="role">
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>Guest</option>
                </select>

                <p class="question">Did you like this page?</p>
                <div class="radio-group">
                    <input type="radio" id="yes" name="answer" value="yes">
                    <label for="yes">Yes</label>
                    <input type="radio" id="no" name="answer" value="no">
                    <label for="no">No</label>
                </div>
                <label for="message">Your Feedback:</label>
                <textarea id="message" name="message" rows="5"></textarea>
                <button type="submit">Submit</button>
            </form>

        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 Bekbolatkyzy Kuralay | SE-2527</p>
    </div>
</body>
</html>
